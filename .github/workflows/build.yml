name: Build PlayView

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show CMake version
        run: cmake --version

      - name: Configure x64
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/PlayView.exe dist/PlayView.exe
          Copy-Item README.md dist/README.txt
          Copy-Item assets/logo.png dist/PlayView-logo.png
          Copy-Item assets/icon.png dist/PlayView-icon.png
          Compress-Archive -Path dist/* -DestinationPath PlayView-Windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayView-Windows-x64
          path: PlayView-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PlayView-Windows-x64.zip
          generate_release_notes: true
